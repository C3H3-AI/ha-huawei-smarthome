list_scenes:
  name: 列出场景
  description: 列出华为智慧生活账号下的全部场景（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    need_check:
      name: 校验模式
      required: false
      selector: {boolean: {}}

scene_detail:
  name: 场景详情
  description: 获取场景的触发器/条件/动作全量详情（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    scenario_id:
      name: 场景 ID
      required: true
      description: 从 list_scenes 返回值里取
      selector: {text: {}}

run_scene:
  name: 立即执行场景
  description: ⚠️ 立即执行一次场景（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    scenario_id:
      name: 场景 ID
      required: true
      description: 从 list_scenes 返回值里取
      selector: {text: {}}

scene_set_enabled:
  name: 启用/禁用场景
  description: 启用或禁用某个场景（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    scenario_id:
      name: 场景 ID
      required: true
      description: 从 list_scenes 返回值里取
      selector: {text: {}}
    enabled:
      name: 是否启用
      required: true
      description: true 启用 / false 禁用
      selector: {boolean: {}}

scene_rename:
  name: 重命名场景
  description: 重命名场景标题（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    scenario_id:
      name: 场景 ID
      required: true
      description: 从 list_scenes 返回值里取
      selector: {text: {}}
    title:
      name: 新标题
      required: true
      description: 场景的新名称
      selector: {text: {}}

scene_logs:
  name: 场景执行日志
  description: 分页查询场景执行日志（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    cursor:
      name: 分页游标
      required: false
      description: 上次返回的游标，首页留空
      selector: {text: {}}
    page_size:
      name: 每页条数
      required: false
      description: 默认 20
      selector: {number: {min: 1, max: 100}}
    start_time:
      name: 开始时间
      required: false
      description: 格式 YYYY-MM-DDTHH:MM:SSZ
      selector: {text: {}}
    end_time:
      name: 结束时间
      required: false
      description: 格式 YYYY-MM-DDTHH:MM:SSZ
      selector: {text: {}}

scenes_by_device:
  name: 按设备查场景
  description: 按设备 deviceId 查询关联场景（逆向推断，未实机验证）
  fields:
    entry_id:
      name: 配置条目 ID
      required: false
      selector: {text: {}}
    device_id:
      name: 设备 ID
      required: true
      description: 华为 IoT 设备 ID
      selector: {text: {}}
